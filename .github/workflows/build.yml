
name: Build Grey Room APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/GreyRoom.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grey-Room-APK
          path: build/GreyRoom.apk
          
